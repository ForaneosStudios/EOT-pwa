name: DAST - Frontend PWA

on:
  workflow_dispatch:
  pull_request:
    branches: [develop, main]
  schedule:
    - cron: "41 5 * * 1"

permissions:
  contents: read

concurrency:
  group: dast-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zap-baseline:
    name: OWASP ZAP baseline scan
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate and build PWA
        run: |
          npm run lint
          npm test
          npm run build

      - name: Start disposable frontend
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > frontend-dast.log 2>&1 &
          echo $! > frontend-dast.pid

          ready=false
          for attempt in {1..30}; do
            if curl --silent --show-error --fail http://127.0.0.1:4173/ > /dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$(cat frontend-dast.pid)" 2>/dev/null; then
              cat frontend-dast.log
              exit 1
            fi
            sleep 2
          done

          if [ "$ready" != true ]; then
            cat frontend-dast.log
            exit 1
          fi

      # This is a passive baseline scan of a disposable local build. It never
      # attacks the deployed application or the real Supabase project.
      - name: Scan PWA with OWASP ZAP
        uses: zaproxy/action-baseline@6c5a007541891231cd9e0ddec25d4f25c59c9874 # v0.15.0
        with:
          target: http://127.0.0.1:4173
          rules_file_name: .zap/frontend-rules.tsv
          cmd_options: "-I -m 2 -T 10"
          fail_action: true
          allow_issue_writing: false
          artifact_name: zap-frontend-baseline-report

      - name: Upload frontend log when startup or scan fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-dast-log
          path: frontend-dast.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop disposable frontend
        if: always()
        shell: bash
        run: |
          if [ -f frontend-dast.pid ]; then
            kill "$(cat frontend-dast.pid)" 2>/dev/null || true
          fi
